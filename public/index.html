<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Bot Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 30px;
        }

        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-online { background-color: #16a34a; color: #fff; }
        .status-connecting { background-color: #ca8a04; color: #fff; }
        .status-offline { background-color: #dc2626; color: #fff; }

        .terminal-box {
            background-color: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            padding: 10px;
            color: #38bdf8;
        }

        .log-entry { margin-bottom: 4px; line-height: 1.3; }
        .log-info { color: #94a3b8; }
        .log-success { color: #4ade80; }
        .log-warn { color: #facc15; }
        .log-error { color: #f87171; }
        .log-chat { color: #e2e8f0; }
        .log-command { color: #c084fc; font-weight: bold; }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 4px;
            background-color: #090d16;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .inventory-slot {
            aspect-ratio: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .inventory-slot:hover {
            border-color: var(--accent-color);
        }

        .slot-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-weight: bold;
            color: #facc15;
            font-size: 0.75rem;
        }

        .btn-custom {
            border-radius: 8px;
            font-weight: 500;
        }

        .modal-content {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .form-control, .form-select {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--bg-dark);
            color: var(--text-main);
            border-color: var(--accent-color);
            box-shadow: none;
        }

        .scoreboard-box {
            background-color: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            min-height: 150px;
            font-family: monospace;
        }

        .scoreboard-title {
            color: #facc15;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }

        .scoreboard-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand text-light fw-bold" href="#">
                <i class="bi bi-box-seam me-2 text-info"></i>Minecraft Bot Control Hub
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-success btn-sm btn-custom" onclick="startAllBots()">
                    <i class="bi bi-play-fill me-1"></i>Hepsini Başlat
                </button>
                <button class="btn btn-danger btn-sm btn-custom" onclick="stopAllBots()">
                    <i class="bi bi-stop-fill me-1"></i>Hepsini Durdur
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4">
        
        <!-- GLOBAL KONTROLLER & GENEL KOMUT -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card p-3">
                    <div class="row align-items-center">
                        <div class="col-md-8 mb-2 mb-md-0">
                            <div class="input-group">
                                <span class="input-group-text bg-dark border-secondary text-light">
                                    <i class="bi bi-terminal"></i>
                                </span>
                                <input type="text" id="globalCommandInput" class="form-control" placeholder="Tüm botlara toplu komut gönder (örnek: /login sifre veya /gir asmp)...">
                                <button class="btn btn-info text-dark fw-bold px-4" onclick="sendGlobalCommand()">Gönder</button>
                            </div>
                        </div>
                        <div class="col-md-4 text-end">
                            <span class="text-muted me-2">Aktif Botlar: <b id="activeBotCount" class="text-info">0</b></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOT KARTLARI KONTEYNERİ -->
        <div class="row g-4" id="botCardsContainer">
            <!-- Bot kartları socket.io ile dinamik yüklenecek -->
        </div>

    </div>

    <!-- BOT AYARLARI MODALI -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="bi bi-gear me-2"></i>Bot Ayarları</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modalBotId">
                    <div class="mb-3">
                        <label class="form-label text-muted">Kullanıcı Adı</label>
                        <input type="text" id="modalUsername" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Otomatik Giriş Şifresi (/login)</label>
                        <input type="text" id="modalAutoPassword" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Alt Sunucu Komutu (Örn: /gir asmp)</label>
                        <input type="text" id="modalAutoSubServerCmd" class="form-control">
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="modalTakeBreaks">
                        <label class="form-check-label" for="modalTakeBreaks">Doğal Mola Sistemi (AFK Yakalanmama)</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="modalDetectStaff">
                        <label class="form-check-label" for="modalDetectStaff">Yetkili Yakınlarındaysa Duraklat</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="modalAutoStart">
                        <label class="form-check-label" for="modalAutoStart">Sistem Başlarken Otomatik Çalıştır</label>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
                    <button type="button" class="btn btn-primary" onclick="saveBotSettings()">Kaydet</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>
    <script>
        const socket = io();
        const botsMap = new Map();
        let settingsModalInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            settingsModalInstance = new bootstrap.Modal(document.getElementById('settingsModal'));
        });

        socket.on('init-data', ({ botList }) => {
            botsMap.clear();
            botList.forEach(bot => botsMap.set(bot.id, bot));
            renderAllBotCards();
        });

        socket.on('bot-added', (bot) => {
            botsMap.set(bot.id, bot);
            renderAllBotCards();
        });

        socket.on('bot-updated', ({ botId, config }) => {
            if (botsMap.has(botId)) {
                botsMap.set(botId, { ...botsMap.get(botId), ...config });
                renderAllBotCards();
            }
        });

        socket.on('bot-deleted', (botId) => {
            botsMap.delete(botId);
            renderAllBotCards();
        });

        socket.on('status-update', ({ botId, status, onlineSince }) => {
            if (botsMap.has(botId)) {
                const bot = botsMap.get(botId);
                bot.status = status;
                bot.onlineSince = onlineSince;
                updateBotCardStatus(botId, status);
            }
        });

        socket.on('bot-log', ({ botId, text, timestamp, type }) => {
            const term = document.getElementById(`terminal-${botId}`);
            if (term) {
                const logLine = document.createElement('div');
                logLine.className = `log-entry log-${type}`;
                logLine.innerText = `[${timestamp}] ${text}`;
                term.appendChild(logLine);
                term.scrollTop = term.scrollHeight;
            }
        });

        socket.on('bot-scoreboard', ({ botId, scoreboard }) => {
            const sbBox = document.getElementById(`scoreboard-${botId}`);
            if (!sbBox) return;
            if (!scoreboard || !scoreboard.lines || scoreboard.lines.length === 0) {
                sbBox.innerHTML = '<div class="text-muted text-center py-4">Scoreboard Yok</div>';
                return;
            }
            let html = `<div class="scoreboard-title">${scoreboard.title}</div>`;
            scoreboard.lines.forEach(l => {
                html += `<div class="scoreboard-line"><span>${l.text}</span><span class="text-info">${l.score}</span></div>`;
            });
            sbBox.innerHTML = html;
        });

        socket.on('bot-inventory', ({ botId, inventory }) => {
            const invGrid = document.getElementById(`inventory-${botId}`);
            if (!invGrid) return;
            invGrid.innerHTML = '';
            for (let i = 0; i < 36; i++) {
                const item = inventory[i];
                const slot = document.createElement('div');
                slot.className = 'inventory-slot';
                if (item) {
                    slot.title = `${item.displayName} (x${item.count})`;
                    slot.innerHTML = `<span class="text-truncate px-1">${item.displayName}</span><span class="slot-count">${item.count}</span>`;
                } else {
                    slot.innerHTML = `<span class="text-muted opacity-25">${i}</span>`;
                }
                invGrid.appendChild(slot);
            }
        });

        function renderAllBotCards() {
            const container = document.getElementById('botCardsContainer');
            container.innerHTML = '';

            let activeCount = 0;
            botsMap.forEach(bot => {
                if (bot.status === 'Online') activeCount++;
                container.appendChild(createBotCardElement(bot));
            });

            document.getElementById('activeBotCount').innerText = activeCount;
        }

        function createBotCardElement(bot) {
            const col = document.createElement('div');
            col.className = 'col-lg-6 col-xl-4';
            col.id = `card-col-${bot.id}`;

            const statusClass = bot.status === 'Online' ? 'status-online' : (bot.status === 'Connecting' ? 'status-connecting' : 'status-offline');

            col.innerHTML = `
                <div class="card h-100 p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-robot fs-4 text-info"></i>
                            <div>
                                <h6 class="mb-0 fw-bold">${bot.username}</h6>
                                <small class="text-muted" style="font-size: 0.75rem;">${bot.proxy || 'Varsayılan Proxy'}</small>
                            </div>
                        </div>
                        <span id="badge-${bot.id}" class="status-badge ${statusClass}">${bot.status}</span>
                    </div>

                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-success btn-sm w-100" onclick="startBot('${bot.id}')">
                            <i class="bi bi-play-fill me-1"></i>Başlat
                        </button>
                        <button class="btn btn-danger btn-sm w-100" onclick="stopBot('${bot.id}')">
                            <i class="bi bi-stop-fill me-1"></i>Durdur
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="openSettingsModal('${bot.id}')">
                            <i class="bi bi-gear-fill"></i>
                        </button>
                    </div>

                    <!-- TABLAR: KONSOL / SCOREBOARD / ENVANTER -->
                    <ul class="nav nav-tabs nav-justified mb-2 border-secondary" style="font-size: 0.8rem;">
                        <li class="nav-item">
                            <button class="nav-link active text-light py-1" data-bs-toggle="tab" data-bs-target="#tab-log-${bot.id}">Konsol</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link text-light py-1" data-bs-toggle="tab" data-bs-target="#tab-sb-${bot.id}">Scoreboard</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link text-light py-1" data-bs-toggle="tab" data-bs-target="#tab-inv-${bot.id}">Envanter</button>
                        </li>
                    </ul>

                    <div class="tab-content mb-3">
                        <div class="tab-pane fade show active" id="tab-log-${bot.id}">
                            <div class="terminal-box" id="terminal-${bot.id}"></div>
                        </div>
                        <div class="tab-pane fade" id="tab-sb-${bot.id}">
                            <div class="scoreboard-box" id="scoreboard-${bot.id}">
                                <div class="text-muted text-center py-4">Scoreboard Yükleniyor...</div>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="tab-inv-${bot.id}">
                            <div class="inventory-grid" id="inventory-${bot.id}">
                                ${Array(36).fill(0).map((_, i) => `<div class="inventory-slot"><span class="text-muted opacity-25">${i}</span></div>`).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- TEK BOTA KOMUT GÖNDERME -->
                    <div class="input-group input-group-sm">
                        <input type="text" id="cmd-${bot.id}" class="form-control" placeholder="Komut yaz..." onkeypress="if(event.key==='Enter') sendSingleCommand('${bot.id}')">
                        <button class="btn btn-outline-info" onclick="sendSingleCommand('${bot.id}')">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </div>
            `;
            return col;
        }

        function updateBotCardStatus(botId, status) {
            const badge = document.getElementById(`badge-${botId}`);
            if (badge) {
                badge.className = `status-badge ${status === 'Online' ? 'status-online' : (status === 'Connecting' ? 'status-connecting' : 'status-offline')}`;
                badge.innerText = status;
            }
        }

        function startBot(botId) { socket.emit('start-bot', botId); }
        function stopBot(botId) { socket.emit('stop-bot', botId); }
        function startAllBots() { socket.emit('start-all'); }
        function stopAllBots() { socket.emit('stop-all'); }

        function sendSingleCommand(botId) {
            const input = document.getElementById(`cmd-${botId}`);
            if (!input || !input.value.trim()) return;
            socket.emit('send-command', { targetBotId: botId, command: input.value.trim() });
            input.value = '';
        }

        function sendGlobalCommand() {
            const input = document.getElementById('globalCommandInput');
            if (!input || !input.value.trim()) return;
            socket.emit('send-command', { targetBotId: 'all', command: input.value.trim() });
            input.value = '';
        }

        function openSettingsModal(botId) {
            const bot = botsMap.get(botId);
            if (!bot) return;

            document.getElementById('modalBotId').value = bot.id;
            document.getElementById('modalUsername').value = bot.username;
            document.getElementById('modalAutoPassword').value = bot.autoPassword || '';
            document.getElementById('modalAutoSubServerCmd').value = bot.autoSubServerCmd || '';
            document.getElementById('modalTakeBreaks').checked = bot.takeBreaks !== false;
            document.getElementById('modalDetectStaff').checked = bot.detectStaff !== false;
            document.getElementById('modalAutoStart').checked = bot.autoStart !== false;

            settingsModalInstance.show();
        }

        function saveBotSettings() {
            const botId = document.getElementById('modalBotId').value;
            const config = {
                autoPassword: document.getElementById('modalAutoPassword').value.trim(),
                autoSubServerCmd: document.getElementById('modalAutoSubServerCmd').value.trim(),
                takeBreaks: document.getElementById('modalTakeBreaks').checked,
                detectStaff: document.getElementById('modalDetectStaff').checked,
                autoStart: document.getElementById('modalAutoStart').checked
            };

            socket.emit('update-bot-config', { botId, config });
            settingsModalInstance.hide();
        }
    </script>
</body>
  </html>
